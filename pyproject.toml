[project]
name = "code-index"
version = "0.1.0"
description = "AST-backed code index across many git checkouts, for coding agents"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=1.16",
  "mcp>=2.0",
]

[project.scripts]
codeindex = "codeindex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
